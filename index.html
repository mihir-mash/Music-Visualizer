<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse MP3 Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Pulse MP3 Player</div>
      <div class="header-actions">
        <label class="pill-btn" for="folderInput">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h5l2 3h9v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
          </svg>
          <span>Load Folder</span>
        </label>
        <div class="dropdown" id="vizMenu">
          <button class="dropdown-trigger" id="vizTrigger">
            <span class="icon-dot"></span>
            <span>Visualizer Settings</span>
            <span class="caret">▾</span>
          </button>
          <div class="dropdown-menu" id="vizMenuList" role="listbox" aria-label="Visualizer mode">
            <button class="dropdown-item" data-mode="central" role="option">
              <span class="item-icon central"></span>
              <span>Central Shape (Integrated)</span>
            </button>
            <button class="dropdown-item" data-mode="fluid" role="option">
              <span class="item-icon fluid"></span>
              <span>Full-Screen Fluid Swirl</span>
            </button>
            <button class="dropdown-item" data-mode="off" role="option">
              <span class="item-icon off"></span>
              <span>Shape Mode Off</span>
            </button>
          </div>
        </div>
      </div>
      <input id="folderInput" type="file" webkitdirectory directory multiple accept="audio/mpeg">
    </header>

    <nav class="tabbar" aria-label="Primary">
      <button class="tab-btn active" data-tab="visualizer">Visualizer</button>
      <button class="tab-btn" data-tab="controls">Audio Controls</button>
      <button class="tab-btn" data-tab="playlist">Playlist</button>
    </nav>

    <main class="tab-panels">
      <section id="visualizerTab" class="tab-panel active" data-name="visualizer">
        <div class="canvas-wrap">
          <canvas id="visualizer"></canvas>
          <div class="shape-chip">Visualizer mode: <span id="shapeLabel">Central Shape (Integrated)</span></div>
        </div>
      </section>

      <section id="controlsTab" class="tab-panel" data-name="controls">
        <div class="controls-grid">
          <div class="control-row centered">
            <button id="prevBtn" class="icon-btn" aria-label="Previous"></button>
            <button id="playBtn" class="icon-btn" aria-label="Play/Pause"></button>
            <button id="nextBtn" class="icon-btn" aria-label="Next"></button>
            <button id="shuffleBtn" class="icon-btn toggle" aria-label="Shuffle"></button>
            <button id="repeatBtn" class="icon-btn toggle" aria-label="Repeat"></button>
          </div>
          <div class="control-row">
            <span id="currentTime" class="time-label">0:00</span>
            <input id="progress" class="progress" type="range" min="0" max="100" value="0" step="0.1">
            <span id="duration" class="time-label">0:00</span>
          </div>

          <div class="eq-card">
            <div class="eq-header">
              <div>
                <p class="eyebrow">Interactive Parametric EQ</p>
                <h2>16-Band Graphic EQ</h2>
              </div>
              <button id="resetEq" class="pill-btn pill-sm">Reset EQ</button>
            </div>
            <div class="eq-canvas-wrap">
              <canvas id="eqCanvas"></canvas>
            </div>
          </div>
        </div>
      </section>

      <section id="playlistTab" class="tab-panel" data-name="playlist">
        <div class="playlist-pane">
          <div class="search-bar">
            <input id="playlistSearch" type="text" placeholder="Search playlist..." aria-label="Search playlist">
          </div>
          <div id="playlist" class="playlist"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
